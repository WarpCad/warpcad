<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Content-Security-Policy (TODO/ai-004, docs/decisions/ai-partner.md decision 8). A meta tag
         because GitHub Pages cannot set response headers; a meta policy cannot express
         `frame-ancestors` or reporting. The part that matters is `connect-src`: script injected
         on this origin cannot post the stored API key anywhere but the two hosts the app already
         talks to, plus `gist.githubusercontent.com` (TODO/io-017: the only way to the full text of
         a gist file over about 1 MB, docs/decisions/gist-storage.md). `img-src` has no remote host, which closes the image-beacon exfiltration route.
         `style-src` allows inline because Vue and Vite emit inline styles (CSS cannot run script);
         `script-src` does not. The dev server relaxes `connect-src` for its HMR websocket only
         (vite.config.js); this tag is the production policy. e2e/csp.e2e.js fails on any
         `securitypolicyviolation` against the running app. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' https://api.anthropic.com https://api.github.com https://gist.githubusercontent.com; img-src 'self' blob: data:; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:"
    />
    <!-- Duplicates src/styles/tokens.css's --surface-0 on purpose (TODO/build-002):
         this value must paint correctly before any CSS file has loaded, since
         tokens.css only reaches the page as a JS-module side-effect import, which
         is too late to prevent a white flash on first paint. -->
    <style>
      html,
      body {
        background: #10131a;
      }
    </style>
    <!-- Tab and home-screen icons, all from public/favicon.svg (`npm run icons`). The .ico is
         for browsers that ignore an SVG icon; Safari's tab and iOS's home screen use the
         apple-touch-icon. The install icons live in the web app manifest (vite.config.js). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The link preview card (TODO/io-016): every WarpCad link — a shared project included — gets
         this one generic card. A shared project travels in the URL fragment, which no crawler sees,
         so a per-project title or thumbnail would need a server (docs/decisions/share-link.md,
         option C). Absolute URLs on the canonical host, which is what preview crawlers require. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WarpCad" />
    <meta property="og:title" content="A 3D model made in WarpCad" />
    <meta property="og:description" content="Tap to see it in your browser. Turn it with a finger, zoom in, and make your own copy. Nothing to install, no account." />
    <meta property="og:image" content="https://app.warpcad.com/github-social-preview.png" />
    <meta property="og:image:alt" content="WarpCad, a parametric CAD app that runs in the browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A 3D model made in WarpCad" />
    <meta name="twitter:description" content="Tap to see it in your browser. Nothing to install, no account." />
    <meta name="twitter:image" content="https://app.warpcad.com/github-social-preview.png" />
    <title>WarpCad</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
