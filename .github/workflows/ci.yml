name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The MCP server's own dependencies (docs/decisions/ai-partner.md decision 3): its specs
      # run in the unit stage and its sources are typechecked.
      - run: npm run mcp:install
      - run: npm run spdx
      - run: npm run licenses
      - run: npm run mcp:licenses
      - run: npm run typecheck
      - run: npm run test:unit -- --run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/naming.spec.js --project=chromium
