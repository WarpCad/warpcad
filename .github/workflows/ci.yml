name: CI

# Two jobs, on purpose. The fast job covers everything that is not a browser. The smoke job runs
# only the `@smoke`-tagged e2e subset: Chrome at desktop (laptop) width, and Safari's engine (WebKit)
# at iPad (tablet, 820×1180, touch) width.
# The full e2e matrix (474 tests x 9 engine/viewport projects) is NOT run here: it is a local run
# (`npm run test:e2e:headless`), because hosted runners bill every minute of it. See
# playwright.config.js (`smoke-*` projects) and CLAUDE.md's Browser Support section.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit, typecheck and guards
    runs-on: ubuntu-latest
    steps:
      # docs/media GIFs live in Git LFS (.gitattributes). This job leaves them as pointer files on
      # purpose (lfs: false): the unit stage and the `guards` project read only file names, sizes and
      # the manifest (e2e/docs-media.spec.js, scripts/help-build.spec.js), never GIF bytes, so
      # downloading 73 MB per run would spend the monthly LFS bandwidth for nothing (TODO/build-012).
      # The Pages build, which bundles the GIFs into Help, restores them from a cache instead.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The MCP server's own dependencies (docs/decisions/ai-partner.md decision 3): its specs
      # run in the unit stage and its sources are typechecked.
      - run: npm run mcp:install
      - run: npm run spdx
      - run: npm run licenses
      - run: npm run mcp:licenses
      - run: npm run typecheck
      - run: npm run test:unit -- --run
      # The `guards` project (e2e/naming.spec.js, e2e/docs-media.spec.js) reads files, not pages,
      # so it needs no browser binary.
      - run: npx playwright test --project=guards

  smoke:
    name: Smoke e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop Chrome at laptop width.
          - browser: chromium
            project: smoke-chromium-laptop
          # Safari's engine (WebKit) at iPad width (Responsive Layout tablet row).
          - browser: webkit
            project: smoke-webkit-tablet
    steps:
      # lfs: false, as in the `test` job: the @smoke specs never open Help or load a GIF.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Each matrix leg names its own project (see the matrix above).
      - run: npx playwright test --project=${{ matrix.project }}

# A superseded pull-request run is cancelled. Pushes to main always finish, because pages.yml
# deploys from the run that tested that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
