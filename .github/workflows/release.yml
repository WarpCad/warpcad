# Cuts a release (TODO/build-013, docs/decisions/release.md): bumps package.json, writes the
# CHANGELOG.md entry and the GitHub release notes, pushes the vX.Y.Z tag, then deploys Pages from
# that tag. Started by hand from the Actions tab; a merge to main deploys nothing.
#
# GITHUB_TOKEN-made tags and releases do not trigger other workflows, so Pages is chained with a
# workflow_call below rather than a `release:` or `push: tags` trigger, which would never fire.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (the first release, 0.0.0 to 1.0.0, is major)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # contents: write pushes the bump commit and tag and creates the release; actions: read lets the
    # gate below look up CI. Nothing else is granted.
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # release-it reads every tag and commit since the previous one
          lfs: false
      # Never tag a commit that failed its own tests.
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh run list --workflow ci.yml --commit "$sha" --json conclusion --jq '.[0].conclusion // "none"')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on $sha is '$conclusion', not 'success'. Wait for it or fix it before releasing."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bump, changelog, tag, push and create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npx release-it --ci --increment "${{ inputs.bump }}"
      - id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
