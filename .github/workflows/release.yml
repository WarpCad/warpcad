# Cuts a release (TODO/build-013, docs/decisions/release.md): bumps package.json, writes the
# CHANGELOG.md entry and the GitHub release notes, pushes the vX.Y.Z tag, then deploys Pages from
# that tag. Started by hand from the Actions tab; a merge to main deploys nothing.
#
# GITHUB_TOKEN-made tags and releases do not trigger other workflows, so Pages is chained with a
# workflow_call below rather than a `release:` or `push: tags` trigger, which would never fire.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (the first release, 0.0.0 to 1.0.0, is major)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # No test job: the tests run locally and .githooks/pre-push refuses a push of main without a stored
  # full unit and e2e run, so Actions minutes are not spent re-running them here.
  release:
    runs-on: ubuntu-latest
    # contents: write pushes the bump commit and tag and creates the release. Nothing else is granted.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # release-it reads every tag and commit since the previous one
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bump, changelog, tag, push and create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # `npm ci` ran `prepare`, which points core.hooksPath at .githooks. That pre-push gate wants
          # a stored local test run and would refuse release-it's push; the local pre-push run is this
          # release's gate, so hooks are switched off here.
          git config core.hooksPath /dev/null
          npx release-it --ci --increment "${{ inputs.bump }}"
      - id: tag
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
