# Deploys the production build to GitHub Pages (docs/decisions/hosting.md).
#
# Runs only after CI has passed on main, and builds exactly the commit CI tested. One-time setup:
# repository Settings → Pages → Source: "GitHub Actions". Pages from a private repository needs a
# paid plan, so on the free org plan this deploys once the repository is public.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one replaces a queued one, but never cancels one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          lfs: false  # the GIFs come from the LFS cache below, not a fresh download (TODO/build-012).
      # docs/media GIFs are Git LFS objects (.gitattributes) and the Help pages bundle them, so this
      # job needs the real files; the cache keeps the 73 MB off GitHub's monthly LFS bandwidth.
      - uses: ./.github/actions/lfs-media
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # The build bundles mcp/ (the AI tool registry), whose dependencies live in mcp/package.json.
      - run: npm run mcp:install
      # `base_path` is "/warpcad" at warpcad.github.io/warpcad/ and "" behind a custom domain;
      # vite.config.js normalises either into Vite's `base`.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Error reporting (TODO/build-004, docs/decisions/error-reporting.md). All optional: with
          # none set the build sends and uploads nothing. The DSN is public by design (a variable);
          # the auth token is a secret and is never given a VITE_ prefix, so it cannot reach the bundle.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          VITE_SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Page-view analytics (TODO/build-007, docs/decisions/analytics.md). Optional: with the
          # repository variable unset the build carries no tag and its CSP allows no Google host. The
          # measurement ID is public by design (a variable, not a secret).
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      # Source maps (TODO/build-009; replaces @sentry/vite-plugin, whose dependency `sentry` is
      # FSL-licensed). The build wrote hidden maps only because SENTRY_AUTH_TOKEN was set. Each bundle
      # file and its map are uploaded to Sentry's release-files API under the release the app reports
      # at runtime (VITE_SENTRY_RELEASE, the same commit SHA). Any HTTP error fails the job.
      - name: Upload source maps to Sentry
        if: ${{ vars.SENTRY_DSN != '' }}
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::SENTRY_DSN is set but SENTRY_AUTH_TOKEN, SENTRY_ORG or SENTRY_PROJECT is not: errors are reported but not unminified."
            exit 0
          fi
          # Region host from the DSN (o123.ingest.us.sentry.io -> us.sentry.io); sentry.io otherwise.
          dsn_host="${SENTRY_DSN#*@}"; dsn_host="${dsn_host%%/*}"
          api_host="$(echo "$dsn_host" | sed -nE 's#^o[0-9]+\.ingest\.([a-z]+)\.sentry\.io$#\1.sentry.io#p')"
          api="https://${api_host:-sentry.io}/api/0/organizations/$SENTRY_ORG/releases"
          auth="Authorization: Bearer $SENTRY_AUTH_TOKEN"
          # The release must exist before files attach to it.
          curl --fail --silent --show-error -X POST "$api/" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"version\":\"$SENTRY_RELEASE\",\"projects\":[\"$SENTRY_PROJECT\"]}" > /dev/null
          # "~" matches any host; the path is the served path (BASE_PATH is "" or "/warpcad").
          count=0
          while IFS= read -r map; do
            js="${map%.map}"
            [ -f "$js" ] || { echo "::error::no bundle file for $map"; exit 1; }
            rel="${js#dist/}"
            # The bundle carries no sourceMappingURL (hidden maps); the Sourcemap header links the two.
            curl --fail --silent --show-error -X POST "$api/$SENTRY_RELEASE/files/" -H "$auth" \
              -F "file=@$js" -F "name=~${BASE_PATH}/$rel" -F "header=Sourcemap:$(basename "$map")" > /dev/null
            curl --fail --silent --show-error -X POST "$api/$SENTRY_RELEASE/files/" -H "$auth" \
              -F "file=@$map" -F "name=~${BASE_PATH}/$rel.map" > /dev/null
            count=$((count + 1))
          done < <(find dist -name '*.js.map')
          if [ "$count" -eq 0 ]; then echo "::error::no source maps in dist/ to upload"; exit 1; fi
          echo "Uploaded $count source maps for release $SENTRY_RELEASE"
      # Maps never ship: Pages serves dist/ as it stands after this step.
      - name: Remove source maps from the Pages artifact
        run: |
          find dist -name '*.map' -delete
          test -z "$(find dist -name '*.map')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
