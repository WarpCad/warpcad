# Deploys the production build to GitHub Pages (docs/decisions/hosting.md).
#
# Runs only after CI has passed on main, and builds exactly the commit CI tested. One-time setup:
# repository Settings → Pages → Source: "GitHub Actions". Pages from a private repository needs a
# paid plan, so on the free org plan this deploys once the repository is public.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one replaces a queued one, but never cancels one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          lfs: true  # docs/media GIFs are Git LFS objects (.gitattributes); the Help pages bundle them.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # The build bundles mcp/ (the AI tool registry), whose dependencies live in mcp/package.json.
      - run: npm run mcp:install
      # `base_path` is "/warpcad" at warpcad.github.io/warpcad/ and "" behind a custom domain;
      # vite.config.js normalises either into Vite's `base`.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Error reporting (TODO/build-004, docs/decisions/error-reporting.md). All optional: with
          # none set the build sends and uploads nothing. The DSN is public by design (a variable);
          # the auth token is a secret and is never given a VITE_ prefix, so it cannot reach the bundle.
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          VITE_SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
