# Monthly dependency PRs: one PR per directory/ecosystem, with every update in it, so the
# month's bumps arrive as one reviewable change instead of a stream. Every PR still has to pass
# CI, including `npm run licenses` (a new transitive licence outside the allow-list fails there,
# and widening the list is the maintainer's call — CLAUDE.md "Licensing").
# CLA and DCO: the bot's commits are exempt from both checks (`.github/workflows/cla.yml`,
# `dco.yml`). Bots change lockfiles and workflow pins, not authored code, so they do not sign.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # Pinned on purpose (docs/decisions/rendering.md, docs/decisions/geometry-kernel.md):
      # upgraded by a deliberate task with its own health check, not by a bot.
      - dependency-name: three
      - dependency-name: "@types/three"
      - dependency-name: "@jscad/*"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
